worker_processes 1;
pid /run/cascade-nginx.pid;
error_log /var/log/cascade-infer/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /opt/nginx/conf/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    include /etc/cascade-infer/cascade.conf;
}