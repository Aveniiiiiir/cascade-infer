# 内网灰度反代：静态官网/对话页 + /v1 鉴权 API + /ui-api 本机免密对话。
# /ui-api 仅允许 127.0.0.1，密钥由 ui_auth.conf 注入；公网发布需另加 HTTPS/WAF。
limit_req_zone $binary_remote_addr zone=cascade_req:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=cascade_conn:10m;

upstream cascade_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 8080 default_server;
    server_name _;
    root /opt/cascade-web;
    index index.html;

    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
        proxy_pass http://cascade_backend/v1/models;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        access_log off;
    }

    # 保留给运维/告警，需 Bearer key（与 /v1 一致）
    location = /metrics {
        proxy_pass http://cascade_backend/metrics;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # 标准 API：客户端自带 key；生产门禁仍验证无 key 401。
    location /v1/ {
        limit_req zone=cascade_req burst=200 nodelay;
        limit_conn cascade_conn 128;
        limit_req_status 429;
        limit_conn_status 429;

        proxy_pass http://cascade_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";

        # SSE 必须关闭缓冲与压缩。
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }

    # 对话页专用：仅本机（SSH 隧道）访问，密钥由实例内文件注入。
    location /ui-api/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        include /etc/cascade-infer/ui_auth.conf;

        limit_req zone=cascade_req burst=200 nodelay;
        limit_conn cascade_conn 128;

        proxy_pass http://cascade_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/cascade-infer/nginx-access.log;
    error_log /var/log/cascade-infer/nginx-error.log;
}
