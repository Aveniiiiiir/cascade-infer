# 内网灰度反代；公网发布必须再加 HTTPS/WAF/认证与审计。
limit_req_zone $binary_remote_addr zone=cascade_req:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=cascade_conn:10m;

upstream cascade_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 8080 default_server;
    server_name _;

    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
        proxy_pass http://cascade_backend/v1/models;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        access_log off;
    }

    location / {
        limit_req zone=cascade_req burst=200 nodelay;
        limit_conn cascade_conn 128;
        limit_req_status 429;
        limit_conn_status 429;

        proxy_pass http://cascade_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";

        # SSE 必须关闭缓冲与压缩，否则首 token 延迟与流式体验会失真。
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }

    access_log /var/log/cascade-infer/nginx-access.log;
    error_log /var/log/cascade-infer/nginx-error.log;
}
