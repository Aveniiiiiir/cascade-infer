[unix_http_server]
file=/run/cascade-supervisor.sock
chmod=0700

[supervisord]
logfile=/var/log/cascade-infer/supervisord.log
pidfile=/run/cascade-supervisord.pid
childlogdir=/var/log/cascade-infer
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/cascade-supervisor.sock

[program:cascade-infer]
command=/etc/cascade-infer/run_server.sh
directory=/root/cascade-release-327b3b4
autostart=true
autorestart=true
startsecs=900
startretries=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=90
stdout_logfile=/var/log/cascade-infer/service.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=5
redirect_stderr=true
environment=PYTHONUNBUFFERED="1"

[program:cascade-nginx]
command=/opt/nginx/sbin/nginx -g "daemon off;" -c /etc/cascade-infer/nginx.conf
autostart=true
autorestart=true
startsecs=2
startretries=3
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/cascade-infer/nginx-supervisor.log
redirect_stderr=true