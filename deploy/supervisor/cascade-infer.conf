[program:cascade-infer]
directory=/root/cascade-release-327b3b4
command=/root/miniconda3/bin/python -m cascade.entrypoints.http.server --model /root/autodl-tmp/DeepSeek-V2-Lite --host 127.0.0.1 --port 8000 --max-model-len 4096 --max-num-seqs 24 --api-key %(ENV_CASCADE_API_KEY)s
environment=PYTHONUNBUFFERED="1",CASCADE_CUDAGRAPH="1"
user=root
autostart=true
autorestart=true
startsecs=600
startretries=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/var/log/cascade-infer/service.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=5
redirect_stderr=true
